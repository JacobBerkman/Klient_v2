name: smoke-and-integration

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check apps/api/src/runtime.mjs
      - run: node --check apps/api/src/storage.mjs
      - run: node --check apps/api/src/server.mjs
      - run: node --check apps/api/src/store.mjs
      - run: node --check apps/web/public/app.js
      - run: node --check scripts/backup-db.mjs
      - run: node --check scripts/export-worker.mjs
      - run: node --check scripts/restore-db.mjs
      - run: node --check scripts/test-harness.mjs
      - run: node --check scripts/smoke-test.mjs
      - run: npm run test:smoke
      - run: git diff --check

  integration:
    runs-on: ubuntu-latest
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        suite:
          - test:integration:tenancy
          - test:integration:rbac
          - test:integration:exports
          - test:integration:templates
          - test:integration:portal-lifecycle
          - test:integration:analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check scripts/test-harness.mjs
      - run: node --check scripts/integration-tenancy.mjs
      - run: node --check scripts/integration-rbac.mjs
      - run: node --check scripts/integration-exports.mjs
      - run: node --check scripts/integration-templates.mjs
      - run: node --check scripts/integration-portal-lifecycle.mjs
      - run: node --check scripts/integration-analytics.mjs
      - run: npm run ${{ matrix.suite }}
