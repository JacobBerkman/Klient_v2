name: smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check apps/api/src/runtime.mjs
      - run: node --check apps/api/src/storage.mjs
      - run: node --check apps/api/src/server.mjs
      - run: node --check apps/api/src/store.mjs
      - run: node --check apps/web/public/app.js
      - run: node --check scripts/backup-db.mjs
      - run: node --check scripts/export-worker.mjs
      - run: node --check scripts/restore-db.mjs
      - run: node --check scripts/smoke-test.mjs
      - run: node --check scripts/ci-regression-test.mjs
      - run: node scripts/smoke-test.mjs
      - run: git diff --check

  regression:
    runs-on: ubuntu-latest
    needs: smoke
    env:
      TZ: UTC
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/ci-regression-test.mjs

  browser-e2e-optional:
    runs-on: ubuntu-latest
    needs: smoke
    if: ${{ hashFiles('apps/web/e2e/**/*') != '' || hashFiles('tests/e2e/**/*') != '' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Attempt browser E2E suite when available
        run: |
          if npm run | grep -q "test:e2e"; then
            npm run test:e2e
          elif npx --no-install playwright --version >/dev/null 2>&1; then
            npx --no-install playwright test
          else
            echo "No browser E2E command found; skipping optional browser job."
          fi
