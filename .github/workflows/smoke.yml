name: ci-gate

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'

permissions:
  contents: read

concurrency:
  group: ci-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NODE_ENV: test
  TZ: UTC
  TEST_SEED: '1337'
  RANDOM_SEED: '1337'
  FORCE_COLOR: '0'

jobs:
  docs_and_gate_config:
    name: 1) docs + gate config parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate release docs and gate command wiring
        run: |
          mkdir -p artifacts/docs-and-gate-config
          {
            npm run check:release-docs
            npm run check:release-gate-commands
          } 2>&1 | tee artifacts/docs-and-gate-config/suite.log

      - name: Upload failure artifacts (docs + gate config)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docs-and-gate-config-failure-artifacts
          if-no-files-found: warn
          path: |
            artifacts/docs-and-gate-config/**

  hard_release_gate:
    name: 2) hard release gate (validate:master)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run canonical hard release gate
        run: |
          mkdir -p artifacts/hard-release-gate
          {
            echo "# Hard release gate readiness summary"
            echo "- suite: validate:master"
            echo "- seed: ${TEST_SEED}"
            echo "- node: $(node --version)"
            echo "- npm: $(npm --version)"
          } > artifacts/hard-release-gate/readiness-summary.md

          npm run validate:master 2>&1 | tee artifacts/hard-release-gate/suite.log

      - name: Upload failure artifacts (hard release gate)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hard-release-gate-failure-artifacts
          if-no-files-found: warn
          path: |
            artifacts/hard-release-gate/**
            test-results/**
            snapshots/**
            tmp/**/snapshots/**

  e2e_release_blocking:
    name: 6) e2e release-blocking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run release-blocking E2E suite
        run: |
          mkdir -p artifacts/e2e-release-blocking
          {
            echo "# E2E release-blocking readiness summary"
            echo "- suite: e2e release-blocking"
            echo "- seed: ${TEST_SEED}"
            echo "- node: $(node --version)"
            echo "- npm: $(npm --version)"
          } > artifacts/e2e-release-blocking/readiness-summary.md

          E2E_GREP='@release-blocking' npm run test:e2e 2>&1 | tee artifacts/e2e-release-blocking/suite.log

      - name: Upload failure artifacts (e2e release-blocking)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-release-blocking-failure-artifacts
          if-no-files-found: warn
          path: |
            artifacts/e2e-release-blocking/**
            artifacts/release-evidence/**
            test-results/**
            playwright-report/**
            snapshots/**
            tmp/**/snapshots/**

  merge_gate:
    name: merge gate (required)
    runs-on: ubuntu-latest
    needs:
      - syntax_lint
      - smoke_runtime_contract
      - api_contract
      - full_integration
      - migration_checks
      - e2e_release_blocking
    if: always()
    steps:
      - name: Enforce green CI before merge
        run: |
          results=(
            "${{ needs.syntax_lint.result }}"
            "${{ needs.smoke_runtime_contract.result }}"
            "${{ needs.api_contract.result }}"
            "${{ needs.full_integration.result }}"
            "${{ needs.migration_checks.result }}"
            "${{ needs.e2e_release_blocking.result }}"
          )

          for result in "${results[@]}"; do
            if [ "$result" != "success" ]; then
              echo "At least one required suite failed; merge gate is red."
              exit 1
            fi
          done

          echo "All required suites passed; merge gate is green."
