services:
  kinetic-klient:
    build: .
    ports:
      - "3000:3000"
    read_only: true
    tmpfs:
      - /tmp
      - /app/tmp
    volumes:
      - ./data:/app/data
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      NODE_ENV: production
      APP_SECRET: ${APP_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
